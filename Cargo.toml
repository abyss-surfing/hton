[workspace]
resolver = "3"
members = ["crates/contracts", "crates/runtime-contract", "crates/fs-support", "crates/logging", "crates/core", "crates/runtime", "crates/host-support"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs", "process"] }
getrandom = "0.3"
serde_yaml = "0.9"
yaml-rust2 = { version = "0.10", default-features = false }
jsonschema = { version = "0.33", default-features = false }
hton-contracts = { path = "crates/contracts" }
hton-runtime-contract = { path = "crates/runtime-contract" }
hton-storage = { path = "crates/fs-support" }
hton-logging = { path = "crates/logging" }
hton-host = { path = "crates/host-support" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
